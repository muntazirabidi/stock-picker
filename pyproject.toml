[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "equity-research"
version = "0.1.0"
description = "Multi-universe stock screening and portfolio management system"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Muntazir Abidi"}
]

dependencies = [
    # Data processing
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "pyarrow>=14.0.0",  # parquet support

    # Financial data
    "yfinance>=0.2.0",  # Free Yahoo Finance data

    # HTTP & API
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "tenacity>=8.2.0",  # retry logic

    # Data validation
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # Database
    "sqlalchemy>=2.0.0",

    # UI
    "streamlit>=1.29.0",
    "plotly>=5.18.0",

    # CLI
    "click>=8.1.0",
    "rich>=13.7.0",  # pretty terminal output

    # Utilities
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.7.0",
    "ruff>=0.1.0",
    "pandas-stubs>=2.0.0",
]

[project.scripts]
equity-research = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # line length handled separately

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
